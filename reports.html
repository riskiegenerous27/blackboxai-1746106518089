<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SmartRetail - Laporan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
    <!-- Fixed Bottom Navbar -->
    <nav class="navbar fixed-bottom navbar-dark bg-primary d-flex justify-content-around" style="height: 60px;">
        <a href="index.html" class="nav-link d-flex flex-column align-items-center text-white" style="font-size: 0.75rem;">
            <i class="bi bi-cash-stack" style="font-size: 1.5rem;"></i>
            Kasir
        </a>
        <a href="manage-products.html" class="nav-link d-flex flex-column align-items-center text-white" style="font-size: 0.75rem;">
            <i class="bi bi-box-seam" style="font-size: 1.5rem;"></i>
            Produk
        </a>
        <a href="manage-inventory.html" class="nav-link d-flex flex-column align-items-center text-white" style="font-size: 0.75rem;">
            <i class="bi bi-stack" style="font-size: 1.5rem;"></i>
            Inventaris
        </a>
        <a href="reports.html" class="nav-link d-flex flex-column align-items-center text-white" style="font-size: 0.75rem;">
            <i class="bi bi-bar-chart" style="font-size: 1.5rem;"></i>
            Laporan
        </a>
        <button id="barcode-scan-btn" class="btn btn-outline-light d-flex flex-column align-items-center" title="Scan Barcode" style="font-size: 0.75rem;">
            <i class="bi bi-upc-scan" style="font-size: 1.5rem;"></i>
            Scan
        </button>
    </nav>

    <div class="container my-4">
        <h3>Ringkasan Laporan</h3>
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card text-white bg-primary">
                    <div class="card-body">
                        <h5 class="card-title">Total Penjualan Hari Ini</h5>
                        <p class="card-text" id="total-sales">Rp 0</p>
                    </div>
                </div>
            </div>
        </div>

        <form id="report-form" class="mb-4">
            <div class="row g-3 align-items-center">
                <div class="col-auto">
                    <label for="report-date" class="col-form-label">Pilih Periode Laporan:</label>
                </div>
                <div class="col-auto">
                    <input type="date" id="report-date" class="form-control" />
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Tampilkan</button>
                </div>
            </div>
        </form>

        <table class="table table-striped" id="report-table">
            <thead>
                <tr>
                    <th>Produk</th>
                    <th>Jumlah Terjual</th>
                    <th>Total Pendapatan</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data laporan akan ditampilkan di sini -->
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
