<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SmartRetail - Manajemen Inventaris</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="barcode-scanner.js" type="module"></script>
    <script src="script.js" type="module"></script>
</head>
<body>
    <!-- Fixed Bottom Navbar -->
    <nav class="navbar fixed-bottom navbar-dark bg-primary d-flex justify-content-between px-4" style="height: 60px;">
        <div class="d-flex gap-4">
            <a href="index.html" class="nav-link d-flex flex-column align-items-center text-white" style="font-size: 0;">
                <i class="bi bi-cash-stack" style="font-size: 1.5rem;"></i>
            </a>
            <a href="manage-products.html" class="nav-link d-flex flex-column align-items-center text-white" style="font-size: 0;">
                <i class="bi bi-box-seam" style="font-size: 1.5rem;"></i>
            </a>
        </div>
        <button id="barcode-scan-btn" class="btn btn-outline-light d-flex flex-column align-items-center" title="Scan Barcode" style="font-size: 0;">
            <i class="bi bi-upc-scan" style="font-size: 1.5rem;"></i>
        </button>
        <div class="d-flex gap-4">
            <a href="manage-inventory.html" class="nav-link d-flex flex-column align-items-center text-white" style="font-size: 0;">
                <i class="bi bi-stack" style="font-size: 1.5rem;"></i>
            </a>
            <a href="reports.html" class="nav-link d-flex flex-column align-items-center text-white" style="font-size: 0;">
                <i class="bi bi-bar-chart" style="font-size: 1.5rem;"></i>
            </a>
        </div>
    </nav>

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>Manajemen Inventaris</h3>
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#stockModal">
                Penyesuaian Stok
            </button>
        </div>

        <table class="table table-striped" id="inventory-table">
            <thead>
                <tr>
                    <th>Nama</th>
                    <th>SKU</th>
                    <th>Stok</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data inventaris akan ditampilkan di sini -->
            </tbody>
        </table>
    </div>

    <!-- Modal Penyesuaian Stok -->
    <div class="modal fade" id="stockModal" tabindex="-1" aria-labelledby="stockModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <form id="stock-form" class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="stockModalLabel">Penyesuaian Stok</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="stock-product-id" />
                    <div class="mb-3">
                        <label for="stock-quantity" class="form-label">Jumlah Stok Baru</label>
                        <input type="number" class="form-control" id="stock-quantity" min="0" required />
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success">Simpan</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
