<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SmartRetail - Kasir</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <script src="barcode-scanner.js" type="module"></script>
    <script src="script.js" type="module"></script>
</head>
<body>
    <!-- Fixed Bottom Navbar -->
    <nav class="navbar fixed-bottom navbar-dark bg-primary d-flex justify-content-between px-4" style="height: 60px;">
        <div class="d-flex gap-4">
            <a href="index.html" class="nav-link d-flex flex-column align-items-center text-white" style="font-size: 0;">
                <i class="bi bi-cash-stack" style="font-size: 1.5rem;"></i>
            </a>
            <a href="manage-products.html" class="nav-link d-flex flex-column align-items-center text-white" style="font-size: 0;">
                <i class="bi bi-box-seam" style="font-size: 1.5rem;"></i>
            </a>
        </div>
        <button id="barcode-scan-btn" class="btn btn-outline-light d-flex flex-column align-items-center" title="Scan Barcode" style="font-size: 0;">
            <i class="bi bi-upc-scan" style="font-size: 1.5rem;"></i>
        </button>
        <div class="d-flex gap-4">
            <a href="manage-inventory.html" class="nav-link d-flex flex-column align-items-center text-white" style="font-size: 0;">
                <i class="bi bi-stack" style="font-size: 1.5rem;"></i>
            </a>
            <a href="reports.html" class="nav-link d-flex flex-column align-items-center text-white" style="font-size: 0;">
                <i class="bi bi-bar-chart" style="font-size: 1.5rem;"></i>
            </a>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row g-4">
            <!-- Area Input Produk -->
            <div class="col-md-4">
                <h5>Cari Produk</h5>
                <input type="text" id="product-search" class="form-control mb-3" placeholder="Cari Produk" />
                <div id="search-results" class="list-group mb-3" style="max-height: 200px; overflow-y: auto;"></div>
            </div>

            <!-- Keranjang Belanja -->
            <div class="col-md-8">
                <h5>Keranjang Belanja</h5>
                <table class="table table-striped" id="cart-table">
                    <thead>
                        <tr>
                            <th>Nama Produk</th>
                            <th>Harga</th>
                            <th>Kuantitas</th>
                            <th>Subtotal</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Cart items will be dynamically inserted here -->
                    </tbody>
                    <tfoot>
                        <tr>
                            <th colspan="3" class="text-end">Total:</th>
                            <th id="cart-total">Rp 0</th>
                            <th></th>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>

        <div class="row g-4 mt-3">
            <!-- Area Pembayaran -->
            <div class="col-md-6">
                <div class="card p-3">
                    <h5>Metode Pembayaran</h5>
                    <div class="btn-group mb-3" role="group" aria-label="Metode Pembayaran">
                        <button type="button" class="btn btn-outline-primary" id="pay-cash">Tunai</button>
                        <button type="button" class="btn btn-outline-primary" id="pay-card">Kartu</button>
                        <button type="button" class="btn btn-outline-primary" id="pay-qris">QRIS</button>
                        <button type="button" class="btn btn-outline-primary" id="pay-online">Online</button>
                    </div>
                    <div id="cash-payment-area" class="mb-3 d-none">
                        <label for="cash-amount" class="form-label">Jumlah Uang Tunai</label>
                        <input type="number" class="form-control" id="cash-amount" min="0" />
                        <div class="mt-2">
                            <strong>Kembalian: </strong><span id="change-amount">Rp 0</span>
                        </div>
                    </div>
                    <button type="button" class="btn btn-primary" id="pay-button">Bayar</button>
                </div>
            </div>

            <!-- Tombol Aksi Cepat -->
            <div class="col-md-6 d-flex align-items-center">
                <div class="btn-group w-100" role="group" aria-label="Tombol Aksi Cepat">
                    <button type="button" class="btn btn-secondary">Diskon</button>
                    <button type="button" class="btn btn-danger">Batal</button>
                    <button type="button" class="btn btn-warning">Tahan</button>
                    <button type="button" class="btn btn-success">Lanjutkan</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

    <!-- Camera modal -->
    <div class="modal fade" id="cameraModal" tabindex="-1" aria-labelledby="cameraModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="cameraModalLabel">Scan Barcode</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="camera-close-btn"></button>
          </div>
          <div class="modal-body">
            <video id="camera-stream" autoplay playsinline style="width: 100%; height: auto; border-radius: 0.25rem;"></video>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
