<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SmartRetail - Manajemen Produk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="barcode-scanner.js" type="module"></script>
    <script src="script.js" type="module"></script>
</head>
<body>
    <!-- Fixed Bottom Navbar -->
    <nav class="navbar fixed-bottom navbar-dark bg-primary d-flex justify-content-between px-4" style="height: 60px;">
        <div class="d-flex gap-4">
            <a href="index.html" class="nav-link d-flex flex-column align-items-center text-white" style="font-size: 0;">
                <i class="bi bi-cash-stack" style="font-size: 1.5rem;"></i>
            </a>
            <a href="manage-products.html" class="nav-link d-flex flex-column align-items-center text-white" style="font-size: 0;">
                <i class="bi bi-box-seam" style="font-size: 1.5rem;"></i>
            </a>
        </div>
        <button id="barcode-scan-btn" class="btn btn-outline-light d-flex flex-column align-items-center" title="Scan Barcode" style="font-size: 0;">
            <i class="bi bi-upc-scan" style="font-size: 1.5rem;"></i>
        </button>
        <div class="d-flex gap-4">
            <a href="manage-inventory.html" class="nav-link d-flex flex-column align-items-center text-white" style="font-size: 0;">
                <i class="bi bi-stack" style="font-size: 1.5rem;"></i>
            </a>
            <a href="reports.html" class="nav-link d-flex flex-column align-items-center text-white" style="font-size: 0;">
                <i class="bi bi-bar-chart" style="font-size: 1.5rem;"></i>
            </a>
        </div>
    </nav>

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>Daftar Produk</h3>
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productModal">
                Tambah Produk Baru
            </button>
        </div>

        <table class="table table-striped" id="products-table">
            <thead>
                <tr>
                    <th>Nama</th>
                    <th>SKU</th>
                    <th>Harga</th>
                    <th>Stok</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody>
                <!-- Produk akan ditampilkan di sini -->
            </tbody>
        </table>
    </div>

    <!-- Modal Tambah/Edit Produk -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <form id="product-form" class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="productModalLabel">Tambah/Edit Produk</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="product-id" />
                    <div class="mb-3">
                        <label for="product-name" class="form-label">Nama</label>
                        <input type="text" class="form-control" id="product-name" required />
                    </div>
                    <div class="mb-3">
                        <label for="product-description" class="form-label">Deskripsi</label>
                        <textarea class="form-control" id="product-description" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="product-sku" class="form-label">SKU</label>
                        <input type="text" class="form-control" id="product-sku" required />
                    </div>
                    <div class="mb-3">
                        <label for="product-price" class="form-label">Harga Jual</label>
                        <input type="number" class="form-control" id="product-price" min="0" required />
                    </div>
                    <div class="mb-3">
                        <label for="product-cost" class="form-label">Harga Pokok</label>
                        <input type="number" class="form-control" id="product-cost" min="0" required />
                    </div>
                    <div class="mb-3">
                        <label for="product-stock" class="form-label">Stok</label>
                        <input type="number" class="form-control" id="product-stock" min="0" required />
                    </div>
                    <div class="mb-3">
                        <label for="product-category" class="form-label">Kategori</label>
                        <select class="form-select" id="product-category" required>
                            <option value="">Pilih Kategori</option>
                            <option value="Makanan">Makanan</option>
                            <option value="Minuman">Minuman</option>
                            <option value="Elektronik">Elektronik</option>
                            <option value="Pakaian">Pakaian</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="product-brand" class="form-label">Merek</label>
                        <select class="form-select" id="product-brand" required>
                            <option value="">Pilih Merek</option>
                            <option value="Merek A">Merek A</option>
                            <option value="Merek B">Merek B</option>
                            <option value="Merek C">Merek C</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="product-image" class="form-label">URL Gambar</label>
                        <input type="url" class="form-control" id="product-image" />
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-success">Simpan</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
